# ---------------------------------------------------------------------------
# Semana 13. Copien TODO este bloque dentro de "services:" de su
# docker-compose.yml, debajo del ultimo servicio que ya tienen (cliente).
# Respeten la sangria, cada servicio parte con 2 espacios.
# Despues validen con  docker compose config -q  (si no imprime nada, esta bien).
# ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sd_rabbitmq
    hostname: rabbitmq
    ports:
      - "15672:15672"          # consola web http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sd_net]

  procesador:                  # paso 2 y 3, consumidor sin estado, se puede escalar
    build: {context: ., dockerfile: Dockerfile.colas}
    command: ["python", "procesador.py"]
    environment:
      PREFETCH: "${PREFETCH:-1}"
      AUTO_ACK: "${AUTO_ACK:-0}"
      TRABAJO_SEG: "${TRABAJO_SEG:-3}"
    volumes: ["./:/app"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: on-failure
    networks: [sd_net]

  publicador:                  # paso 2, se usa con  docker compose run --rm publicador ...
    build: {context: ., dockerfile: Dockerfile.colas}
    entrypoint: ["python", "publicador.py"]
    environment:
      PERSISTENTE: "1"
    volumes: ["./:/app"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    profiles: ["herramientas"]
    networks: [sd_net]

  worker:                      # paso 4, se escala con  --scale worker=N
    build: {context: ., dockerfile: Dockerfile.colas}
    command: ["python", "worker.py"]
    volumes: ["./:/app"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: on-failure
    networks: [sd_net]

  master:                      # paso 4, se usa con  docker compose run --rm master
    build: {context: ., dockerfile: Dockerfile.colas}
    entrypoint: ["python", "master.py"]
    environment:
      N: "${N:-5000000}"
      TROZOS: "${TROZOS:-40}"
    volumes: ["./:/app"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    profiles: ["herramientas"]
    networks: [sd_net]

  graficar:                    # paso 5, no necesita el broker
    build: {context: ., dockerfile: Dockerfile.colas}
    entrypoint: ["python", "graficar.py"]
    volumes: ["./:/app"]
    profiles: ["herramientas"]
    networks: [sd_net]
